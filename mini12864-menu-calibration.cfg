# Enderwire calibration menu
# Commands are based on sections already present in the supplied printer.cfg:
# screws_tilt_adjust, bed_mesh, skew_correction, input_shaper, and Beacon.

[menu __main __enderwire __calibration]
type: list
name: Calibration
index: 3

[menu __main __enderwire __calibration __screws]
type: command
name: Screws Tilt
index: 0
gcode:
    G28
    SCREWS_TILT_CALCULATE

[menu __main __enderwire __calibration __bed_mesh]
type: command
name: Build Bed Mesh
index: 1
gcode:
    G28
    BED_MESH_CALIBRATE

[menu __main __enderwire __calibration __clear_mesh]
type: command
name: Clear Bed Mesh
index: 2
gcode:
    BED_MESH_CLEAR

[menu __main __enderwire __calibration __z_offset]
type: command
name: Probe Calibrate
index: 3
gcode:
    G28
    PROBE_CALIBRATE

[menu __main __enderwire __calibration __pid_hotend]
type: command
name: PID Hotend 240C
index: 4
gcode:
    PID_CALIBRATE HEATER=extruder TARGET=240

[menu __main __enderwire __calibration __pid_bed]
type: command
name: PID Bed 80C
index: 5
gcode:
    PID_CALIBRATE HEATER=heater_bed TARGET=80

[menu __main __enderwire __calibration __save]
type: command
name: Save Config
index: 6
gcode:
    SAVE_CONFIG
