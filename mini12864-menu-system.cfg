#####################################################################
# Enderwire Mini12864 - System Menu
#####################################################################

[menu __main __enderwire __system]
type: list
name: System
index: 5


#####################################################################
# Klipper Restart
#####################################################################

[menu __main __enderwire __system __restart]
type: command
name: Restart Klipper
index: 0
gcode:
    RESTART


#####################################################################
# Firmware Restart
#####################################################################

[menu __main __enderwire __system __firmware_restart]
type: command
name: Firmware Restart
index: 1
gcode:
    FIRMWARE_RESTART


#####################################################################
# Raspberry Pi Restart
#####################################################################

[delayed_gcode restart_rpi]
initial_duration: 0
gcode:
    {action_call_remote_method("reboot_machine")}

[menu __main __enderwire __system __rpi_restart]
type: command
name: Restart Raspberry Pi
index: 2
enable: {printer.idle_timeout.state != "Printing"}
gcode:
    M117 Restarting RPi...
    {menu.exit()}
    UPDATE_DELAYED_GCODE ID=restart_rpi DURATION=1


#####################################################################
# Raspberry Pi Shutdown
#####################################################################

[delayed_gcode shutdown_rpi]
initial_duration: 0
gcode:
    {action_call_remote_method("shutdown_machine")}

[menu __main __enderwire __system __rpi_shutdown]
type: command
name: Shutdown Raspberry Pi
index: 3
enable: {printer.idle_timeout.state != "Printing"}
gcode:
    M117 Shutting down RPi...
    {menu.exit()}
    UPDATE_DELAYED_GCODE ID=shutdown_rpi DURATION=1


#####################################################################
# Emergency Stop
#####################################################################

[menu __main __enderwire __system __emergency_stop]
type: command
name: Emergency Stop
index: 4
gcode:
    M112