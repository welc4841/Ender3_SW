# Enderwire temperature and filament-preparation menu

[menu __main __enderwire __temperature]
type: list
name: Temperature
index: 0

[menu __main __enderwire __temperature __pla]
type: command
name: Preheat PLA
index: 0
gcode:
    M140 S60
    M104 S210

[menu __main __enderwire __temperature __petg]
type: command
name: Preheat PETG
index: 1
gcode:
    M140 S80
    M104 S240

[menu __main __enderwire __temperature __abs]
type: command
name: Preheat ABS
index: 2
gcode:
    M140 S100
    M104 S250

[menu __main __enderwire __temperature __cooldown]
type: command
name: Cooldown
index: 3
gcode:
    TURN_OFF_HEATERS
    M107

[menu __main __enderwire __temperature __hotend]
type: input
name: Hotend: {menu.input|int}C
index: 4
input: {printer.extruder.target}
input_min: 0
input_max: 300
input_step: 5
realtime: True
gcode:
    M104 S{'%.0f' % menu.input}

[menu __main __enderwire __temperature __bed]
type: input
name: Bed: {menu.input|int}C
index: 5
input: {printer.heater_bed.target}
input_min: 0
input_max: 130
input_step: 5
realtime: True
gcode:
    M140 S{'%.0f' % menu.input}
