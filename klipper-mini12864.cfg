#lcd_type: uc1701
#cs_pin: menu:PB15
#a0_pin: menu:PB12
#rst_pin: menu:PB13
#encoder_pins: ^menu:PC10,^menu:PC11
#click_pin: ^!menu:PC6
#contrast: 63
#spi_bus: spi1
#spi_software_mosi_pin: menu:PA7
#spi_software_miso_pin: menu:PA6
#spi_software_sclk_pin: menu:PA5

