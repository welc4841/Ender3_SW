# Enderwire print-control menu

[menu __main __enderwire __print]
type: list
name: Print Control
index: 2

[menu __main __enderwire __print __pause]
type: command
name: Pause Print
index: 0
enable: {printer["print_stats"].state == "printing"}
gcode:
    PAUSE

[menu __main __enderwire __print __resume]
type: command
name: Resume Print
index: 1
enable: {printer.pause_resume.is_paused}
gcode:
    RESUME

[menu __main __enderwire __print __cancel]
type: command
name: Cancel Print
index: 2
enable: {printer["print_stats"].state in ("printing", "paused")}
gcode:
    CANCEL_PRINT

[menu __main __enderwire __print __speed]
type: input
name: Speed: {menu.input|int}%
index: 3
input: {printer.gcode_move.speed_factor * 100}
input_min: 25
input_max: 200
input_step: 5
realtime: True
gcode:
    M220 S{'%.0f' % menu.input}

[menu __main __enderwire __print __flow]
type: input
name: Flow: {menu.input|int}%
index: 4
input: {printer.gcode_move.extrude_factor * 100}
input_min: 75
input_max: 125
input_step: 1
realtime: True
gcode:
    M221 S{'%.0f' % menu.input}
