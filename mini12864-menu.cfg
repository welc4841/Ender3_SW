# Enderwire Mini12864 custom menu loader
# Add this line to printer.cfg after your other includes:
# [include mini12864-menu.cfg]
#
# Keep these menu files in the same config directory.

[include mini12864-menu-preheat.cfg]
[include mini12864-menu-motion.cfg]
[include mini12864-menu-print.cfg]
[include mini12864-menu-calibration.cfg]
[include mini12864-menu-lighting.cfg]
[include mini12864-menu-system.cfg]

# Custom top-level menu. The stock Klipper menus remain available.
[menu __main __enderwire]
type: list
name: Enderwire
index: 0
