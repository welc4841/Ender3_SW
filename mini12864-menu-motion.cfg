# Enderwire homing and motion menu

[menu __main __enderwire __motion]
type: list
name: Home / Motion
index: 1

[menu __main __enderwire __motion __home_all]
type: command
name: Home All
index: 0
gcode:
    G28

[menu __main __enderwire __motion __home_xy]
type: command
name: Home XY
index: 1
gcode:
    G28 X Y

[menu __main __enderwire __motion __home_z]
type: command
name: Home Z
index: 2
gcode:
    G28 Z

[menu __main __enderwire __motion __park_center]
type: command
name: Park Center
index: 3
enable: {printer.toolhead.homed_axes == "xyz"}
gcode:
    G90
    G1 Z20 F1200
    G1 X109 Y100 F6000

[menu __main __enderwire __motion __motors_off]
type: command
name: Motors Off
index: 4
gcode:
    M84
